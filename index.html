<!DOCTYPE html>
<html>
<head>
  <title>Patchbay Trainer</title>

  <style>
    body {
      margin: 0;
      background: #111;
      font-family: Arial;
      color: white;
    }

    #introScreen {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 5000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #introBox {
      width: 480px;
      background: #1a1a1a;
      padding: 25px;
      border-radius: 10px;
      border: 1px solid #333;
    }

    #introBox input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    #header {
      position: sticky;
      top: 0;
      z-index: 999;
      background: rgba(0,0,0,0.95);
      padding: 15px;
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid #333;
    }

    #questionText {
      max-width: 70%;
      font-size: 18px;
    }

    #progressText {
      font-size: 13px;
      opacity: 0.7;
    }

    #controls {
      display: flex;
      gap: 10px;
    }

    #container {
      position: relative;
      width: 100%;
      max-width: 1600px;
      margin: auto;
    }

    #patchbay {
      width: 100%;
      display: block;
    }

    #cables, #points {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #cables { z-index: 2; }
    #points { z-index: 3; }

    .patch-point {
      position: absolute;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.25);
    }

    .pending { background: orange; }
    .correct { background: #00ff66; }
    .incorrect { background: #ff4444; }
    .selected { background: yellow !important; }
  </style>
</head>

<body>

<div id="introScreen">
  <div id="introBox">
    <h1>Patchbay Homework Assignment</h1>

    <p>
      Each question represents a routing task.<br><br>
      Click on the patch points to make connections.<br><br>
      Commit when ready.
    </p>

    <input id="nameInput" placeholder="Enter your name">
    <button onclick="startGame()">Start</button>
  </div>
</div>

<div id="header">
  <div>
    <div id="questionText">Loading...</div>
    <div id="progressText"></div>
  </div>

  <div id="controls">
    <button onclick="undoLast()">Undo</button>
    <button onclick="commitPatches()">Commit</button>
  </div>
</div>

<div id="container">
  <img src="patchbay.png" id="patchbay">
  <svg id="cables"></svg>
  <div id="points"></div>
</div>

<script>

/* ================= STATE ================= */
let gameStarted = false;
let userName = "";

const API_URL = "https://script.google.com/macros/s/AKfycbxpxOupsEFQMIheiLaG14S8Na7lKJtDxHeDw-p7u2bPifjo017dH3T4gxslMBNZGgY1/exec";

let QUESTION_SET = [];
let DATA_BY_ROW = {};
let currentIndex = 0;
let firstPoint = null;

let stateByQuestion = {};
let correctByQuestion = {};
let globalPatches = [];

/* ================= START ================= */
function startGame() {
  userName = document.getElementById("nameInput").value || "Anonymous";
  document.getElementById("introScreen").style.display = "none";
  gameStarted = true;

  init(); // IMPORTANT: ensure quiz starts after clicking Start
}

/* ================= INIT ================= */
async function init() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    data.forEach(d => DATA_BY_ROW[d.row] = d);

    QUESTION_SET = buildQuestionSet(data);

    buildGrid();
    loadQuestion();
  } catch (err) {
    console.error("INIT FAILED:", err);
    document.getElementById("questionText").innerText = "Failed to load questions";
  }
}

/* ================= RANDOMIZATION ================= */
function shuffle(arr){ return arr.sort(()=>Math.random()-0.5); }

function buildQuestionSet(data){
  const TARGET = 10;

  const groups = {};
  const singles = [];

  data.forEach(q=>{
    if(q.group){
      if(!groups[q.group]) groups[q.group]=[];
      groups[q.group].push(q);
    } else singles.push(q);
  });

  let groupBlocks = Object.values(groups);
  shuffle(groupBlocks);
  shuffle(singles);

  let selected = [];

  if(groupBlocks.length) selected.push(...groupBlocks[0]);

  let g=1,s=0;

  while(selected.length<TARGET){
    if(g<groupBlocks.length) selected.push(...groupBlocks[g++]);
    else if(s<singles.length) selected.push(singles[s++]);
    else break;
  }

  const blocks=[];
  const used=new Set();

  selected.forEach(q=>{
    if(q.group){
      if(!used.has(q.group)){
        blocks.push(groups[q.group]);
        used.add(q.group);
      }
    } else blocks.push([q]);
  });

  shuffle(blocks);
  return blocks.flat().map(q=>q.row);
}

/* ================= GRID ================= */
function buildGrid(){
  const rows="ABCDEFGHIJKLMNOP";
  const cols=48;

  const startLeft=8.3;
  const spacingX=1.814;

  const rowTop={
    A:11.7,B:15.4,C:23.2,D:27,E:34.85,F:38.55,G:46.4,H:50.1,
    I:57.45,J:61.2,K:68.32,L:72.05,M:79.2,N:83,O:90.1,P:93.9
  };

  const points=document.getElementById("points");

  for(let r=0;r<rows.length;r++){
    for(let c=0;c<cols;c++){
      const el=document.createElement("div");
      el.className="patch-point";

      const id=rows[r]+(c+1);
      el.dataset.id=id;

      el.style.left=(startLeft+c*spacingX)+"%";
      el.style.top=rowTop[rows[r]]+"%";

      points.appendChild(el);
    }
  }

  points.addEventListener("click",(e)=>{
    const p=e.target.closest(".patch-point");
    if(!p||!gameStarted) return;

    if(!firstPoint){
      firstPoint=p;
      p.classList.add("selected");
      return;
    }

    if(firstPoint===p){
      firstPoint.classList.remove("selected");
      firstPoint=null;
      return;
    }

    addPatch(firstPoint.dataset.id,p.dataset.id);
    firstPoint.classList.remove("selected");
    firstPoint=null;
  });
}

/* ================= GAME ================= */
function addPatch(from,to){
  const row=QUESTION_SET[currentIndex];
  if(!stateByQuestion[row]) stateByQuestion[row]=[];
  stateByQuestion[row].push({from,to,status:"pending"});
  redraw();
}

function loadQuestion(){
  const row=QUESTION_SET[currentIndex];
  const data=DATA_BY_ROW[row];

  document.getElementById("questionText").innerText=data.question;
  document.getElementById("progressText").innerText=
    `${currentIndex+1} / ${QUESTION_SET.length}`;

  correctByQuestion[row]=data.patches||[];
  if(!stateByQuestion[row]) stateByQuestion[row]=[];

  redraw();
}

function redraw(){
  const svg=document.getElementById("cables");
  svg.innerHTML="";
  const rect=document.getElementById("container").getBoundingClientRect();

  QUESTION_SET.forEach(row=>{
    const patches=stateByQuestion[row]||[];

    patches.forEach(p=>{
      const a=document.querySelector(`[data-id="${p.from}"]`);
      const b=document.querySelector(`[data-id="${p.to}"]`);
      if(!a||!b)return;

      const r1=a.getBoundingClientRect();
      const r2=b.getBoundingClientRect();

      const line=document.createElementNS("http://www.w3.org/2000/svg","line");

      line.setAttribute("x1",r1.left-rect.left+r1.width/2);
      line.setAttribute("y1",r1.top-rect.top+r1.height/2);
      line.setAttribute("x2",r2.left-rect.left+r2.width/2);
      line.setAttribute("y2",r2.top-rect.top+r2.height/2);

      let color="orange";
      if(p.status==="correct") color="#00ff66";
      if(p.status==="incorrect") color="#ff4444";

      line.setAttribute("stroke",color);
      line.setAttribute("stroke-width","3");

      svg.appendChild(line);

      a.classList.add(p.status);
      b.classList.add(p.status);
    });
  });
}

/* ================= CONTROLS ================= */
function undoLast(){
  const row=QUESTION_SET[currentIndex];
  stateByQuestion[row].pop();
  redraw();
}

function commitPatches(){
  const row=QUESTION_SET[currentIndex];
  const user=stateByQuestion[row];
  const correct=correctByQuestion[row];

  user.forEach(p=>{
    const ok=correct.some(c=>
      (c.from===p.from&&c.to===p.to)||
      (c.from===p.to&&c.to===p.from)
    );
    p.status=ok?"correct":"incorrect";
    globalPatches.push({...p});
  });

  currentIndex++;

  if(currentIndex>=QUESTION_SET.length){
    alert("Complete!");
    return;
  }

  loadQuestion();
}

</script>
</body>
</html>
